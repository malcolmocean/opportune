<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#090b22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="opportune">
<title>opportune</title>
<link rel="icon" type="image/png" href="/web/icon.png">
<link rel="apple-touch-icon" href="/web/icon.png">
<link rel="manifest" href="/web/app.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/web/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <radialGradient id="lanternHalo">
    <stop offset="0" stop-color="#ffb070" stop-opacity=".95"/>
    <stop offset=".35" stop-color="#ff6b3d" stop-opacity=".45"/>
    <stop offset="1" stop-color="#ff6b3d" stop-opacity="0"/>
  </radialGradient>
</defs></svg>

<header class="top" id="top">
  <div class="brand"><img src="/web/icon.png" alt="" width="30" height="30"><span>opportune</span></div>
  <div class="who" id="who"></div>
</header>

<main id="main">
  <section class="screen onboard" data-screen="onboard" id="s-onboard" hidden></section>
  <section class="screen" data-screen="perms" id="s-perms" hidden></section>
  <section class="screen" data-screen="home" id="s-home" hidden></section>
  <section class="screen" data-screen="nudges" id="s-nudges" hidden></section>
  <section class="screen" data-screen="review" id="s-review" hidden></section>
  <section class="screen" data-screen="people" id="s-people" hidden></section>
  <section class="screen" data-screen="sources" id="s-sources" hidden></section>
  <section class="screen" data-screen="windows" id="s-windows" hidden></section>
  <section class="screen screen-map" data-screen="map" id="s-map" hidden>
    <div id="mapEl" class="map"></div>
    <div class="map-legend" id="mapLegend">Loading…</div>
  </section>
  <section class="screen" data-screen="settings" id="s-settings" hidden></section>
</main>

<nav class="tabbar" id="tabbar" role="tablist" aria-label="sections" hidden>
  <button role="tab" data-tab="home" aria-selected="true">
    <svg viewBox="0 0 24 24"><path d="M12 3c-3.5 4-5 6.5-5 9.5a5 5 0 0 0 10 0C17 9.5 15.5 7 12 3z"/><path d="M12 11c-1.2 1.4-1.8 2.4-1.8 3.5a1.8 1.8 0 0 0 3.6 0c0-1.1-.6-2.1-1.8-3.5z"/></svg>
    <span>Home</span>
  </button>
  <button role="tab" data-tab="nudges" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
    <span>Nudges</span><i class="badge" id="nudgeBadge" hidden></i>
  </button>
  <button role="tab" data-tab="people" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 19c.6-3.3 3.2-5 6.5-5s5.9 1.7 6.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.2c2.6.2 4.4 1.6 5 4.3"/></svg>
    <span>People</span>
  </button>
  <button role="tab" data-tab="map" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
    <span>Map</span>
  </button>
  <button role="tab" data-tab="settings" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg>
    <span>Settings</span>
  </button>
</nav>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" id="sheetBody"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="/web/app.js"></script>
</body>
</html>
