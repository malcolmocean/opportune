<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2380e4">
<title>opportune</title>
<link rel="icon" type="image/png" href="/web/icon.png">
<link rel="apple-touch-icon" href="/web/icon.png">
<link rel="manifest" href="/web/manifest.webmanifest">
<link rel="stylesheet" href="/web/manage.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="/web/icon.png" alt="" width="28" height="28"><span>opportune</span></div>
  <div class="who" id="who"></div>
</header>

<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="people" aria-selected="true">People</button>
  <button role="tab" data-tab="sources">Sources</button>
  <button role="tab" data-tab="review">Review</button>
  <button role="tab" data-tab="map">Map</button>
  <button role="tab" data-tab="settings">Settings</button>
</nav>

<main id="main">
  <section class="panel" data-panel="people" id="p-people"></section>
  <section class="panel" data-panel="sources" id="p-sources" hidden></section>
  <section class="panel" data-panel="review" id="p-review" hidden></section>
  <section class="panel panel-map" data-panel="map" id="p-map" hidden><div id="mapEl" class="map"></div><div class="map-legend" id="mapLegend"></div></section>
  <section class="panel" data-panel="settings" id="p-settings" hidden></section>
</main>

<div class="toast" id="toast" hidden></div>
<div class="gate" id="gate" hidden>
  <h1>opportune</h1>
  <p id="gateMsg">This page needs a link from your agent. Ask it for <code>/manage</code> in Telegram.</p>
</div>

<script type="module" src="/web/manage.js"></script>
</body>
</html>
